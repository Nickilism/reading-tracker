name: Deploy Reading Tracker

on:
  # 方式1: push 核心文件时自动触发
  push:
    branches: [main]
    paths:
      - 'template.js'
      - 'reading-tracker-github.js'
      - 'reading-tracker-year-github.js'
      - 'index.html'

  # 方式2: Airtable Automation 触发
  repository_dispatch:
    types: [airtable-update]

  # 方式3: 手动触发
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Generate Reading Tracker
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          WEAREAD_API_KEY: ${{ secrets.WEAREAD_API_KEY }}
        run: |
          node reading-tracker-github.js
          # 1 月同时重建上一年，接住「12 月读完、1 月才录入/修改」的书（年份按 UTC，与生成器默认年份一致）
          if [ "$(date -u +%m)" = "01" ]; then
            node reading-tracker-github.js "$(( $(date -u +%Y) - 1 ))"
          fi

      - name: Sync generated files back to main
        # 让 main 与 gh-pages 内容一致：年度页、阅读报告、封面、微信读书缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "reading archive/" covers/ weread-cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated changes to sync"
          else
            git commit -m "chore: sync generated files from CI"
            git push origin HEAD:main || echo "::warning::Generated files sync push failed; will retry on next run"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
